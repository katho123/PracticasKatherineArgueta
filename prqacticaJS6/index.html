<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="texto"> Hola </h1>
    <script>
 
let num1, num2, suma, resta, multi, divi, resi;
 
num1 = Number(prompt("Ingrese el primer numero"));
 num2 = Number(prompt("Ingrese el segundo numero"));

 suma = num1 + num2;
 resta = num1 - num2;
 multi = num1 * num2;
 divi = num1 / num2;
 resi = num1 % num2;

document.write("la suma de los números es: " + suma + "<br>" );
document.write("la resta de los números es: " + resta + "<br>" );
document.write("la multiplicación de los números es: " + multi + "<br>"  );
document.write("la division de los números es: " + divi + "<br>"  );
document.write("el residuo de los números es: " + resi + "<br>"  );
 
</script>
</body>
</html>
