<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    
    <h1 id="puntaje">0</h1>

    <button oneclick="agregar()">Agregar (1) puntos</button>
    <button oneclick="duplicar()">Duplicar puntos</button>

    <script>
        let puntos = 0;
        let marcador = document.getElementById("puntaje");

        function agregar() {
            puntos += 1  //Lo mismo que: puntos = puntos + 1;
            marcador.innerText = puntos;
        }

        function duplicar() {
            puntos *= 2; //Lo mismo que: puntos *=2
            marcador.innerText = puntos;
        }
    </script>
</body>
</html>
